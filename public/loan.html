
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Details | Waafi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top">
    <a href="index.html" class="brand">Waafi</a>
</header>

<main class="page">

    <section class="panel">

        <h1>Choose Loan Amount</h1>

        <p class="muted">
            Select the amount and repayment period
            for your test application.
        </p>

        <form id="loanForm">

            <label>
                Requested Amount (USD)

                <input
                    type="number"
                    name="amount"
                    min="100"
                    max="5000"
                    step="50"
                    placeholder="Enter amount"
                    required>
            </label>

            <label>
                Repayment Period (Months)

                <select name="months" required>

                    <option value="6">6 Months</option>
                    <option value="12" selected>12 Months</option>
                    <option value="18">18 Months</option>
                    <option value="24">24 Months</option>
                    <option value="36">36 Months</option>
                    <option value="48">48 Months</option>
                    <option value="60">60 Months</option>

                </select>
            </label>

            <button type="submit" class="button">
                CONTINUE
            </button>

        </form>

        <p class="notice">
            This is a test application.
            Submitting it does not guarantee loan approval.
        </p>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
